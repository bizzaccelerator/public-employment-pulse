# =============================================================================
# CI PIPELINE — public-employment-pulse
# =============================================================================

name: CI

on:
  push:
    branches: [ main, development ]
    paths:
      # registro_hv module
      - "code_used/snippets_support/workload/registro_hv.py"
      - "code_used/snippets_support/tests/db_operations.py"
      - "code_used/snippets_support/tests/test_registro_hv.py"
      - "code_used/snippets_support/tests/test_integration.py"
      - "fixtures/fixture_data.py"
      # orientacion_hv module
      - "code_used/snippets_support/workload/orientacion_hv.py"
      - "code_used/snippets_support/tests/db_operations_orientacion.py"
      - "code_used/snippets_support/tests/test_orientacion_hv.py"
      - "code_used/snippets_support/tests/test_integration_orientacion.py"
      - "fixtures/fixture_data_orientacion.py"
      # vacantes module
      - "code_used/snippets_support/workload/vacantes.py"
      - "code_used/snippets_support/tests/db_operations_vacantes.py"
      - "code_used/snippets_support/tests/test_vacantes.py"
      - "code_used/snippets_support/tests/test_integration_vacantes.py"
      # shared
      - ".github/workflows/ci.yml"
      - "requirements-test.txt"

  pull_request:
    branches: [ main, development ]
    paths:
      # registro_hv module
      - "code_used/snippets_support/workload/registro_hv.py"
      - "code_used/snippets_support/tests/db_operations.py"
      - "code_used/snippets_support/tests/test_registro_hv.py"
      - "code_used/snippets_support/tests/test_integration.py"
      - "fixtures/fixture_data.py"
      # orientacion_hv module
      - "code_used/snippets_support/workload/orientacion_hv.py"
      - "code_used/snippets_support/tests/db_operations_orientacion.py"
      - "code_used/snippets_support/tests/test_orientacion_hv.py"
      - "code_used/snippets_support/tests/test_integration_orientacion.py"
      - "fixtures/fixture_data_orientacion.py"
      # vacantes module
      - "code_used/snippets_support/workload/vacantes.py"
      - "code_used/snippets_support/tests/db_operations_vacantes.py"
      - "code_used/snippets_support/tests/test_vacantes.py"
      - "code_used/snippets_support/tests/test_integration_vacantes.py"
      # shared
      - ".github/workflows/ci.yml"
      - "requirements-test.txt"

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: registro_hv — Unit tests
  # ---------------------------------------------------------------------------
  unit-tests-registro:
    name: "Unit Tests · registro_hv"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest code_used/snippets_support/tests/test_registro_hv.py \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=unit-test-results-registro.json

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-registro
          path: unit-test-results-registro.json
          retention-days: 30


  # ---------------------------------------------------------------------------
  # JOB 2: registro_hv — Integration tests
  # Runs only after unit tests pass (saves minutes on obvious breakage).
  # ---------------------------------------------------------------------------
  integration-tests-registro:
    name: "Integration Tests · registro_hv"
    runs-on: ubuntu-latest
    needs: unit-tests-registro

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     postgres
      DB_USER:     postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres... attempt $i"
            sleep 2
          done

      - name: Run integration tests
        run: |
          pytest code_used/snippets_support/tests/test_integration.py \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=integration-test-results-registro.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-registro
          path: integration-test-results-registro.json
          retention-days: 30


  # ---------------------------------------------------------------------------
  # JOB 3: orientacion_hv — Unit tests
  # ---------------------------------------------------------------------------
  unit-tests-orientacion:
    name: "Unit Tests · orientacion_hv"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest code_used/snippets_support/tests/test_orientacion_hv.py \
