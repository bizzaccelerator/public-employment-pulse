# .github/workflows/ci.yml
# =============================================================================
# CI PIPELINE — public-employment-pulse
# =============================================================================
# Triggered on every push and pull request to main/develop.
#
# TWO JOBS:
#
#  unit-tests
#  ----------
#  Runs the full pytest unit suite (test_registro_hv.py).
#  No external services needed — pure Python + pandas.
#  Fast: ~60 seconds including pip install.
#
#  integration-tests
#  -----------------
#  Runs test_integration.py against a real PostgreSQL 15 container.
#  Catches column mapping drift, MERGE idempotency, and DB round-trip
#  correctness — things unit tests structurally cannot verify.
#  Slower: ~90 seconds including DB spin-up.
#
# BOTH JOBS MUST PASS before a PR can be merged. Enforce via:
# GitHub -> Settings -> Branches -> Require status checks before merging.
# =============================================================================

name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - "code_used/snippets_support/workload/registro_hv.py"
      - "code_used/snippets_support/tests/db_operations.py"
      - "code_used/snippets_support/tests/test_registro_hv.py"
      - "code_used/snippets_support/tests/test_integration.py"
      - "fixtures/**"
      - ".github/workflows/ci.yml"
      - "requirements-test.txt"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "code_used/snippets_support/workload/registro_hv.py"
      - "code_used/snippets_support/tests/db_operations.py"
      - "code_used/snippets_support/tests/test_registro_hv.py"
      - "code_used/snippets_support/tests/test_integration.py"
      - "fixtures/**"
      - ".github/workflows/ci.yml"
      - "requirements-test.txt"

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Unit tests — no database needed
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest code_used/snippets_support/tests/test_registro_hv.py \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=unit-test-results.json

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.json
          retention-days: 30


  # ---------------------------------------------------------------------------
  # JOB 2: Integration tests — PostgreSQL service container required
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     postgres
      DB_USER:     postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres... attempt $i"
            sleep 2
          done

      - name: Run integration tests
        run: |
          pytest code_used/snippets_support/tests/test_integration.py \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=integration-test-results.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-test-results.json
          retention-days: 30


  # ---------------------------------------------------------------------------
  # JOB 3: Notify on failure (main branch only)
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests ]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send failure notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false
          username:       ${{ secrets.GMAIL_USERNAME }}
          password:       ${{ secrets.GMAIL_APP_PASSWORD }}
          subject:        "CI FAILED - public-employment-pulse (${{ github.sha }})"
          to:             ${{ secrets.RECIPIENT_EMAILS }}
          from:           ${{ secrets.GMAIL_USERNAME }}
          body: |
            One or more CI jobs failed on the main branch.

            Commit : ${{ github.sha }}
            Author : ${{ github.actor }}
            Branch : ${{ github.ref_name }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/run/${{ github.run_id }}

            Check the Actions tab for the full test report and logs.