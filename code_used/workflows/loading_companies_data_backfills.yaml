id: companies-raw-data-pipeline_backfills
namespace: public_employment_pulse

inputs:
  - id: data_processed
    type: SELECT
    description: Data of interest processed.
    displayName: "Choose the data of interest."
    defaults: empresas
    values: [ registro_hv, orientacion, intermediacion, vacantes, empresas ]
    
variables:
  staging_table: "public.{{inputs.data_processed}}_staging"
  table: "public.{{inputs.data_processed}}"
  file: "{{inputs.data_processed}}_{{ trigger.date | date('yyyy_M') }}"
  month_name: "{{ trigger.date | date('MMMM') | lower }}"
  month_padded: "{{ '%02d' | format( trigger.date | date('M') ) }}"

tasks:
  - id: download_registries_file
    type: io.kestra.plugin.gcp.gcs.Download
    from: gs://operations-raw-data_public-employment-pulse/Empresas_registradas_co.xlsx

  - id: reading_monthly_registries
    type: io.kestra.plugin.scripts.python.Commands
    docker:
      image: python:3.11-slim
    description: "identifying the new companies registered in {{ vars.month_name }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include:
        - "empresas.py"
    beforeCommands:
      - pip install pandas numpy datetime openpyxl pyarrow fastparquet
    inputFiles:
      empresas: '{{ outputs.download_registries_file.uri }}'
    env:
      MONTH: "{{ trigger.date | date('M') }}"
      YEAR: "{{ trigger.date | date('yyyy') }}"
    commands:
      - "python empresas.py"
    outputFiles:
      - "*.parquet"
      - "record_count.txt"
  
  - id: log_completion
    type: io.kestra.core.tasks.log.Log
    message: "Excel files processed successfully"
  
  - id: drop_tables_if_exists
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      DROP TABLE IF EXISTS {{render(vars.staging_table)}};
      DROP TABLE IF EXISTS {{render(vars.table)}};
  
  - id: create_companies_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      -- Create main table if not exists
      CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
          id SERIAL PRIMARY KEY,
          tipo_documento VARCHAR(100), 
          numero_documento BIGINT, 
          razon_social VARCHAR(255), 
          naturaleza VARCHAR(100),
          tipo_empresa VARCHAR(100), 
          actividad_economica VARCHAR(255), 
          sector VARCHAR(200), 
          tamanio VARCHAR(100), 
          codigo_sede BIGINT, 
          nombre_sede VARCHAR(255), 
          telefono VARCHAR(50), 
          direccion VARCHAR(255), 
          tipo_sede VARCHAR(50),
          ciudad VARCHAR(100), 
          departamento VARCHAR(100), 
          nombre_administrador VARCHAR(255), 
          email_administrador VARCHAR(255),
          fecha_registro TIMESTAMP, 
          canal_de_registro VARCHAR(100), 
          prestador_aprobo VARCHAR(255),
          agencia_aprobo VARCHAR(255), 
          agente_aprobo VARCHAR(255), 
          pais VARCHAR(100), 
          telefono_clean VARCHAR(100), 
          mes INTEGER, 
          anio INTEGER,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      
      -- Create staging table
      CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
          LIKE {{render(vars.table)}} INCLUDING ALL
      );
  
  - id: load_data_to_staging
    type: io.kestra.plugin.scripts.python.Script
    docker:
      image: python:3.11-slim
    beforeCommands:
      - pip install pandas sqlalchemy psycopg2-binary pyarrow fastparquet
    inputFiles:
      data_file: "{{ outputs.reading_monthly_registries.outputFiles['empresas_'+ trigger.date | date('yyyy_M') +'.parquet'] }}"
    env:
      DB_HOST: "{{ kv('POSTGRES_HOST') }}"
      DB_PORT: "{{ kv('POSTGRES_PORT') }}"
      DB_NAME: "{{ kv('POSTGRES_DB') }}"
      DB_USER: "{{ kv('POSTGRES_USER') }}"
      DB_PASSWORD: "{{ kv('POSTGRES_PASSWORD') }}"
    script: |
        import pandas as pd
        import numpy as np
        from sqlalchemy import create_engine
        import os
        
        # Connection
        connection_string = f"postgresql://{os.getenv('DB_USER')}:{os.getenv('DB_PASSWORD')}@{os.getenv('DB_HOST')}:{os.getenv('DB_PORT', '5432')}/{os.getenv('DB_NAME')}"
        engine = create_engine(connection_string)
        
        # Read parquet
        df = pd.read_parquet('data_file')
        
        print(f"Original columns: {list(df.columns)}")
        
        # Clean column names - map from actual parquet columns to database columns
        column_mapping = {
            'id': 'id', 
            'tipo_documento': 'tipo_documento', 
            'número_documento': 'numero_documento', 
            'razón_social': 'razon_social',
            'naturaleza': 'naturaleza',
            'tipo_empresa': 'tipo_empresa', 
            'actividad_económica': 'actividad_economica', 
            'sector': 'sector', 
            'tamaño': 'tamanio',
            'código_sede': 'codigo_sede', 
            'nombre_sede': 'nombre_sede',
            'teléfono': 'telefono',
            'dirección': 'direccion',
            'tipo_sede': 'tipo_sede',
            'ciudad': 'ciudad',
            'departamento': 'departamento',
            'nombre_administrador': 'nombre_administrador',
            'email_administrador': 'email_administrador',
            'fecha_registro': 'fecha_registro',
            'canal_de_registro': 'canal_de_registro',
            'prestador_aprobó': 'prestador_aprobo',
            'agencia_aprobó': 'agencia_aprobo',
            'agente_aprobó': 'agente_aprobo',
            'país': 'pais',
            'teléfono_clean': 'telefono_clean', 
            'mes': 'mes', 
            'año': 'anio',
            'created_at': 'created_at'
        }
        
        # Rename columns
        df = df.rename(columns=column_mapping)
        
        # Convert date columns with proper format
        date_columns = ['fecha_registro']
        for col in date_columns:
            if col in df.columns:
                df[col] = pd.to_datetime(df[col], format='mixed', dayfirst=True, errors='coerce')
        
        # Handle numeric columns
        numeric_columns = ['numero_documento', 'codigo_sede', 'mes', 'anio']
        for col in numeric_columns:
            if col in df.columns:
                df[col] = pd.to_numeric(df[col], errors='coerce')
        
        # CRITICAL: Convert any remaining object/array columns to strings
        for col in df.columns:
            if df[col].dtype == 'object':
                # Check if column contains arrays/lists
                if df[col].apply(lambda x: isinstance(x, (list, np.ndarray))).any():
                    df[col] = df[col].apply(lambda x: str(x) if isinstance(x, (list, np.ndarray)) else x)
        
        # Replace numpy NaN with None for proper NULL insertion
        df = df.replace({np.nan: None})
        
        print(f"Loaded {len(df)} rows from parquet")
        print(f"Mapped columns: {list(df.columns)}")
        print(f"Data types: {df.dtypes.to_dict()}")
        
        # Load data into staging table
        df.to_sql(
            'empresas_staging',
            engine,
            if_exists='append',
            index=False,
            method='multi',
            chunksize=100
        )
        
        print(f"Successfully loaded {len(df)} rows to staging table")

  - id: alter_companies_tables_add_columns
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      ALTER TABLE {{render(vars.staging_table)}} 
      ADD COLUMN IF NOT EXISTS unique_row_id VARCHAR(32),
      ADD COLUMN IF NOT EXISTS filename VARCHAR(255);

      ALTER TABLE {{render(vars.table)}} 
      ADD COLUMN IF NOT EXISTS unique_row_id VARCHAR(32),
      ADD COLUMN IF NOT EXISTS filename VARCHAR(255);

  - id: data_table_add_unique_id_and_filename
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      UPDATE {{render(vars.staging_table)}}
      SET 
        unique_row_id = md5(
          COALESCE(numero_documento::text, '') ||
          COALESCE(razon_social, '') || 
          COALESCE(telefono, '') || 
          COALESCE(fecha_registro::text, '') || 
          COALESCE(nombre_administrador, '')
        ),
        filename = '{{render(vars.file)}}';
  
  - id: log_staging_complete
    type: io.kestra.core.tasks.log.Log
    message: "Data loaded to staging table successfully"
  
  - id: identify_companies_incomplete_data
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
        unique_row_id, 
        numero_documento,
        CASE 
          WHEN actividad_economica IS NULL THEN 'actividad_economica'
          WHEN direccion IS NULL THEN 'direccion'
          WHEN actividad_economica IS NULL AND direccion IS NULL THEN 'actividad_economica y direccion'
        END AS missing_field
      FROM empresas_staging
      WHERE actividad_economica IS NULL OR direccion IS NULL;
    fetchType: STORE
  
  - id: convert_incomplete_to_csv
    type: "io.kestra.plugin.serdes.csv.IonToCsv"
    from: "{{ outputs.identify_companies_incomplete_data.uri }}"

  - id: send_email_with_attachment
    type: io.kestra.plugin.notifications.mail.MailSend
    from: "{{ kv('SENDER_EMAIL') }}"
    to: "{{ kv('RECIPIENT_EMAILS') }}"
    subject: "Incomplete Data Report - {{ trigger.date | date('yyyy_M') }}"
    htmlTextContent: |
      <h2>Incomplete Companies Data Report</h2>
      <p>Please find attached the incomplete data report for <strong>{{ trigger.date | date('yyyy_M') }}</strong>.</p>
      <p><strong>Total records processed this month is:</strong> {{ read(outputs.reading_monthly_registries.outputFiles['record_count.txt']) }}</p>
      <p><strong>Total records with missing fields:</strong> {{ outputs.identify_companies_incomplete_data.size }}</p>
      <p>Please review and take appropriate action.</p>
    attachments:
      - name: incomplete_data_{{ trigger.date | date('yyyy_M') }}.csv
        uri: "{{ outputs.convert_incomplete_to_csv.uri }}"
        contentType: text/csv
    host: "{{ kv('SMTP_SERVER') }}"
    port: "{{ kv('SMTP_PORT') }}"
    username: "{{ kv('GMAIL_USERNAME') }}"
    password: "{{ kv('GMAIL_APP_PASSWORD') }}"
    transportStrategy: SMTP_TLS
  
  - id: query_monthly_data_to_upload
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT
        COALESCE(unique_row_id::TEXT, '') AS unique_row_id,
        COALESCE(id::TEXT, '') AS id,
        COALESCE(tipo_documento, '') AS tipo_documento,
        COALESCE(numero_documento::TEXT, '0') AS numero_documento,
        COALESCE(razon_social, '') AS razon_social,
        COALESCE(naturaleza, '') AS naturaleza,
        COALESCE(tipo_empresa, '') AS tipo_empresa,
        COALESCE(actividad_economica, '') AS actividad_economica,
        COALESCE(sector, '') AS sector,
        COALESCE(tamanio, '') AS tamanio,
        COALESCE(codigo_sede::TEXT, '0') AS codigo_sede,
        COALESCE(nombre_sede, '') AS nombre_sede, 
        COALESCE(telefono::TEXT, '0') AS telefono,
        COALESCE(direccion, '') AS direccion,
        COALESCE(tipo_sede, '') AS tipo_sede,
        COALESCE(ciudad, '') AS ciudad,
        COALESCE(departamento, '') AS departamento,
        COALESCE(nombre_administrador, '') AS nombre_administrador,
        COALESCE(email_administrador, '') AS email_administrador,
        COALESCE(fecha_registro::TEXT, '1970-01-01') AS fecha_registro,
        COALESCE(canal_de_registro, '') AS canal_de_registro,
        COALESCE(prestador_aprobo, '') AS prestador_aprobo,
        COALESCE(agencia_aprobo, '') AS agencia_aprobo,
        COALESCE(agente_aprobo, '') AS agente_aprobo,
        COALESCE(pais, '') AS pais,
        COALESCE(telefono_clean::TEXT, '0') AS telefono_clean,
        COALESCE(mes::TEXT, '0') AS mes,
        COALESCE(anio::TEXT, '0') AS anio,
        COALESCE(created_at::TEXT, '') AS created_at,
        COALESCE(filename, '') AS filename
      FROM {{render(vars.staging_table)}}
      WHERE EXTRACT(MONTH FROM fecha_registro) = {{ trigger.date | date('M') }}
        AND EXTRACT(YEAR FROM fecha_registro) = {{ trigger.date | date('yyyy') }};
    store: true
  
  - id: convert_monthly_data_to_parquet
    type: io.kestra.plugin.serdes.parquet.IonToParquet
    from: "{{ outputs.query_monthly_data_to_upload.uri }}"
  
  - id: upload_monthly_data_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.convert_monthly_data_to_parquet.uri }}"
    to: "gs://employment-agency-operational-data/{{ inputs.data_processed }}/{{ trigger.date | date('yyyy') }}/{{ vars.month_name }}/empresas_{{ trigger.date | date('yyyy') }}_{{ trigger.date | date('M') }}.parquet"

triggers:
  - id: Companies_monthly_trigger
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 20 7 * *"
    inputs:
      data_processed: Companies