id: cv-raw-data-pipeline
namespace: public_employment_pulse

inputs:
  - id: data_processed
    type: SELECT
    description: Data of interest processed.
    displayName: "Choose the data of interest."
    defaults: registro_hv
    values: [ registro_hv, orientacion, intermediacion, vacantes, empresas ]

  - id: year_of_interest
    type: SELECT
    description: Year of data to process.
    displayName: "Choose the year of interest."
    defaults: "2026"
    values: [ "2024", "2025", "2026" ]

  - id: month_of_interest
    type: INT
    description: Month of data to process.
    displayName: "Choose the month number of interest."
    defaults: 1
    
variables:
  staging_table: "public.{{inputs.data_processed}}_staging"
  table: "public.{{inputs.data_processed}}"
  file: "{{inputs.data_processed}}_{{ inputs.year_of_interest}}_{{inputs.month_of_interest}}"
  month_name: "{% set month_names = {1: 'january', 2: 'february', 3: 'march', 4: 'april', 5: 'may', 6: 'june', 7: 'july', 8: 'august', 9: 'september', 10: 'october', 11: 'november', 12: 'december'} %}{{ month_names[inputs.month_of_interest] }}"
  month_padded: "{{ '%02d' | format(inputs.month_of_interest) }}"

tasks:
  - id: download_file
    type: io.kestra.plugin.gcp.gcs.Download
    from: gs://operations-raw-data_public-employment-pulse/BD_Registro_2024_2025_acumulado.xlsx

  - id: reading_monthly_registries
    type: io.kestra.plugin.scripts.python.Commands
    docker:
      image: python:3.11-slim
    description: "identifying the data of CVs registered in {{ vars.month_name }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include:
        - "registro_hv.py"
    beforeCommands:
      - pip install pandas numpy datetime openpyxl pyarrow fastparquet
    inputFiles:
      excel_file: '{{ outputs.download_file.uri }}'
    env:
      MONTH: "{{ inputs.month_of_interest }}"
      YEAR: "{{ inputs.year_of_interest }}"
    commands:
      - "python registro_hv.py"
    outputFiles:
      - "*.parquet"
      - "record_count.txt"

  - id: log_completion
    type: io.kestra.plugin.core.log.Log
    message: "Excel file processed successfully"
  
  - id: drop_tables_if_exists
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      DROP TABLE IF EXISTS {{render(vars.staging_table)}};
      DROP TABLE IF EXISTS {{render(vars.table)}};

  - id: create_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      -- Create main table if not exists
      CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
          id SERIAL PRIMARY KEY,
          no INTEGER,
          programa_aliado VARCHAR(255),
          barrio_donde_vive VARCHAR(255),
          tipo_documento VARCHAR(50),
          numero_documento BIGINT,
          tipo_registro VARCHAR(50),
          nombres VARCHAR(255),
          apellidos VARCHAR(255),
          celular VARCHAR(50),
          telefono VARCHAR(50),
          canal_de_registro VARCHAR(100),
          edad INTEGER,
          rango_edad VARCHAR(50),
          genero VARCHAR(50),
          nivel_de_estudio VARCHAR(200),
          titulo_homologado VARCHAR(255),
          ciudad_de_residencia VARCHAR(200),
          email VARCHAR(255),
          fecha_registro TIMESTAMP,
          programa_de_gobierno VARCHAR(255),
          condiciones_especiales TEXT,
          detalle_discapacidades TEXT,
          situacion_laboral VARCHAR(200),
          agente_registra VARCHAR(255),
          fecha_actualizacion TIMESTAMP,
          porcentaje_hoja_vida VARCHAR(20),
          prestador_anterior VARCHAR(255),
          fecha_cambio_prestador TIMESTAMP,
          vereda_localidad_centro_poblado VARCHAR(255),
          pertenece_a VARCHAR(100),
          sise_offline VARCHAR(50),
          mes INTEGER,
          anio INTEGER,
          punto_atencion VARCHAR(255),
          fecha_accion TIMESTAMP,
          grupos_etnicos VARCHAR(100),
          vca VARCHAR(100),
          discapacidad VARCHAR(100),
          migrante VARCHAR(100),
          vvg VARCHAR(100),
          reincorporados VARCHAR(100),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      -- Create staging table
      CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
          LIKE {{render(vars.table)}} INCLUDING ALL
      );
  
  - id: load_data_to_staging
    type: io.kestra.plugin.scripts.python.Script
    docker:
      image: python:3.11-slim
    beforeCommands:
      - pip install pandas sqlalchemy psycopg2-binary pyarrow fastparquet
    inputFiles:
      data_file: "{{ outputs.reading_monthly_registries.outputFiles['registro_hv_'~ inputs.year_of_interest ~'_'~ inputs.month_of_interest ~'.parquet'] }}"
    env:
      DB_HOST: "{{ kv('POSTGRES_HOST') }}"
      DB_PORT: "{{ kv('POSTGRES_PORT') }}"
      DB_NAME: "{{ kv('POSTGRES_DB') }}"
      DB_USER: "{{ kv('POSTGRES_USER') }}"
      DB_PASSWORD: "{{ kv('POSTGRES_PASSWORD') }}"
    script: |
        import pandas as pd
        import numpy as np
        from sqlalchemy import create_engine
        import os
        
        # Connection
        connection_string = f"postgresql://{os.getenv('DB_USER')}:{os.getenv('DB_PASSWORD')}@{os.getenv('DB_HOST')}:{os.getenv('DB_PORT', '5432')}/{os.getenv('DB_NAME')}"
        engine = create_engine(connection_string)
        
        # Read parquet
        df = pd.read_parquet('data_file')
        
        print(f"Original columns: {list(df.columns)}")
        
        # Clean column names - map from actual parquet columns to database columns
        column_mapping = {
            'no._': 'no',
            'programa_/_aliado\n(si_aplica)': 'programa_aliado',
            'barrio_donde_vive': 'barrio_donde_vive',
            'tipo_documento': 'tipo_documento',
            'número_documento': 'numero_documento',
            'tipo_registro': 'tipo_registro',
            'nombres': 'nombres',
            'apellidos': 'apellidos',
            'celular': 'celular',
            'teléfono': 'telefono',
            'canal_de_registro': 'canal_de_registro',
            'edad': 'edad',
            'rango_edad': 'rango_edad',
            'género': 'genero',
            'nivel_de_estudio': 'nivel_de_estudio',
            'título_homologado': 'titulo_homologado',
            'ciudad_de_residencia': 'ciudad_de_residencia',
            'email': 'email',
            'fecha_registro': 'fecha_registro',
            'programa_de_gobierno': 'programa_de_gobierno',
            'condiciones_especiales': 'condiciones_especiales',
            'detalle_discapacidades': 'detalle_discapacidades',
            'situación_laboral': 'situacion_laboral',
            'agente_registra': 'agente_registra',
            'fecha_actualización': 'fecha_actualizacion',
            '%_hoja_vida': 'porcentaje_hoja_vida',
            'prestador_anterior': 'prestador_anterior',
            'fecha_cambio_prestador': 'fecha_cambio_prestador',
            'vereda/localidad/centro_poblado': 'vereda_localidad_centro_poblado',
            'pertenece_a': 'pertenece_a',
            'sise_offline': 'sise_offline',
            'mes': 'mes',
            'año': 'anio',
            'punto_atención': 'punto_atencion',
            'fecha_accion': 'fecha_accion',
            'grupos_etnicos': 'grupos_etnicos',
            'vca': 'vca',
            'discapacidad': 'discapacidad',
            'migrante': 'migrante',
            'vvg': 'vvg',
            'reincorporados': 'reincorporados'
        }
        
        # Rename columns
        df = df.rename(columns=column_mapping)

        if 'numero_documento' in df.columns:
            # Convert to numeric, coercing errors to NaN
            df['numero_documento'] = pd.to_numeric(df['numero_documento'], errors='coerce')
            # Convert to Int64 (nullable integer type)
            df['numero_documento'] = df['numero_documento'].astype('Int64')
        
        # Convert date columns with proper format
        date_columns = ['fecha_registro', 'fecha_actualizacion', 'fecha_cambio_prestador', 'fecha_accion']
        for col in date_columns:
            if col in df.columns:
                df[col] = pd.to_datetime(df[col], format='mixed', dayfirst=True, errors='coerce')
        
        # Handle numeric columns
        numeric_columns = ['edad', 'anio', 'no', 'mes']
        for col in numeric_columns:
            if col in df.columns:
                df[col] = pd.to_numeric(df[col], errors='coerce')
        
        # CRITICAL: Convert any remaining object/array columns to strings
        for col in df.columns:
            if df[col].dtype == 'object':
                # Check if column contains arrays/lists
                if df[col].apply(lambda x: isinstance(x, (list, np.ndarray))).any():
                    df[col] = df[col].apply(lambda x: str(x) if isinstance(x, (list, np.ndarray)) else x)
        
        # Replace numpy NaN with None for proper NULL insertion
        df = df.replace({np.nan: None})
        
        print(f"Loaded {len(df)} rows from parquet")
        print(f"Mapped columns: {list(df.columns)}")
        print(f"Data types: {df.dtypes.to_dict()}")
        
        # Load data into staging table
        df.to_sql(
            'registro_hv_staging',
            engine,
            if_exists='append',
            index=False,
            method='multi',
            chunksize=1000
        )
        
        print(f"Successfully loaded {len(df)} rows to staging table")
  
  - id: alter_tables_add_columns
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      ALTER TABLE {{render(vars.staging_table)}} 
      ADD COLUMN IF NOT EXISTS unique_row_id VARCHAR(32),
      ADD COLUMN IF NOT EXISTS filename VARCHAR(255);

      ALTER TABLE {{render(vars.table)}} 
      ADD COLUMN IF NOT EXISTS unique_row_id VARCHAR(32),
      ADD COLUMN IF NOT EXISTS filename VARCHAR(255);
  
  - id: data_table_add_unique_id_and_filename
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      UPDATE {{render(vars.staging_table)}}
      SET 
        unique_row_id = md5(
          COALESCE(tipo_documento, '') ||
          COALESCE(tipo_registro, '') || 
          COALESCE(nombres, '') || 
          COALESCE(fecha_registro::text, '') || 
          COALESCE(celular, '')
        ),
        filename = '{{render(vars.file)}}';

  - id: log_staging_complete
    type: io.kestra.plugin.core.log.Log
    message: "Data loaded to staging table successfully"

  - id: registries_merge_data
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
          MERGE INTO {{render(vars.table)}} AS T
          USING {{render(vars.staging_table)}} AS S
          ON T.unique_row_id = S.unique_row_id
          WHEN NOT MATCHED THEN
            INSERT (
              unique_row_id, filename, programa_aliado, barrio_donde_vive, tipo_documento, numero_documento, tipo_registro, nombres, apellidos, celular, 
              telefono, canal_de_registro, edad, rango_edad, genero, nivel_de_estudio, titulo_homologado, ciudad_de_residencia, email, 
              fecha_registro, programa_de_gobierno, condiciones_especiales, detalle_discapacidades, situacion_laboral, agente_registra, fecha_actualizacion, 
              porcentaje_hoja_vida, prestador_anterior, fecha_cambio_prestador, vereda_localidad_centro_poblado, pertenece_a, sise_offline, mes, anio, punto_atencion, fecha_accion, 
              grupos_etnicos, vca, discapacidad, migrante, vvg, reincorporados, created_at
            )
            VALUES (
              S.unique_row_id, S.filename, S.programa_aliado, S.barrio_donde_vive, S.tipo_documento, S.numero_documento, S.tipo_registro, S.nombres, S.apellidos, 
              S.celular, S.telefono, S.canal_de_registro, S.edad, S.rango_edad, S.genero, S.nivel_de_estudio, S.titulo_homologado, S.ciudad_de_residencia, S.email, 
              S.fecha_registro, S.programa_de_gobierno, S.condiciones_especiales, S.detalle_discapacidades, S.situacion_laboral, S.agente_registra, S.fecha_actualizacion, 
              S.porcentaje_hoja_vida, S.prestador_anterior, S.fecha_cambio_prestador, S.vereda_localidad_centro_poblado, S.pertenece_a, S.sise_offline, S.mes, S.anio, 
              S.punto_atencion, S.fecha_accion, S.grupos_etnicos, S.vca, S.discapacidad, S.migrante, S.vvg, S.reincorporados, S.created_at
            );

  - id: identify_incomplete_data
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
        unique_row_id, 
        numero_documento,
        CASE 
          WHEN edad IS NULL THEN 'edad'
          WHEN genero IS NULL THEN 'genero'
          WHEN edad IS NULL AND genero IS NULL THEN 'edad y genero'
        END AS missing_field
      FROM registro_hv_staging
      WHERE edad IS NULL OR genero IS NULL;
    fetchType: STORE

  - id: convert_incomplete_to_csv
    type: "io.kestra.plugin.serdes.csv.IonToCsv"
    from: "{{ outputs.identify_incomplete_data.uri }}"
  
  - id: send_email_with_attachment
    type: io.kestra.plugin.notifications.mail.MailSend
    from: "{{ kv('SENDER_EMAIL') }}"
    to: "{{ kv('RECIPIENT_EMAILS') }}"
    subject: "Incomplete Data Report - {{ inputs.month_of_interest }}/{{ inputs.year_of_interest }}"
    htmlTextContent: |
      <h2>Incomplete Data Report</h2>
      <p>Please find attached the incomplete data report for <strong>{{ inputs.month_of_interest }}/{{ inputs.year_of_interest }}</strong>.</p>
      <p><strong>Total records processed this month is:</strong> {{ read(outputs.reading_monthly_registries.outputFiles['record_count.txt']) }}</p>
      <p><strong>Total records with missing edad field:</strong> {{ outputs.identify_incomplete_data.size }}</p>
      <p>Please review and take appropriate action.</p>
    attachments:
      - name: incomplete_data_{{ inputs.month_of_interest }}_{{ inputs.year_of_interest }}.csv
        uri: "{{ outputs.convert_incomplete_to_csv.uri }}"
        contentType: text/csv
    host: "{{ kv('SMTP_SERVER') }}"
    port: "{{ kv('SMTP_PORT') }}"
    username: "{{ kv('GMAIL_USERNAME') }}"
    password: "{{ kv('GMAIL_APP_PASSWORD') }}"
    transportStrategy: SMTP_TLS

  - id: query_data_to_upload
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT
        COALESCE(unique_row_id, '0') as unique_row_id, 
        COALESCE(programa_aliado, '') as programa_aliado,
        COALESCE(barrio_donde_vive, '') as barrio_donde_vive,
        COALESCE(tipo_documento, '') as tipo_documento,
        COALESCE(numero_documento::text, '0') as numero_documento,
        COALESCE(tipo_registro, '') as tipo_registro,
        COALESCE(nombres, '') as nombres,
        COALESCE(apellidos, '') as apellidos,
        COALESCE(celular, '0') as celular,
        COALESCE(telefono, '0') as telefono,
        COALESCE(canal_de_registro, '') as canal_de_registro,
        COALESCE(edad, 0) as edad,
        COALESCE(rango_edad, '') as rango_edad,
        COALESCE(genero, '') as genero,
        COALESCE(nivel_de_estudio, '') as nivel_de_estudio,
        COALESCE(titulo_homologado, '') as titulo_homologado,
        COALESCE(ciudad_de_residencia, '') as ciudad_de_residencia,
        COALESCE(email, '') as email,
        COALESCE(fecha_registro::TIMESTAMP, '1970-01-01') as fecha_registro,
        COALESCE(programa_de_gobierno, '') as programa_de_gobierno,
        COALESCE(condiciones_especiales, '') as condiciones_especiales,
        COALESCE(detalle_discapacidades, '') as detalle_discapacidades,
        COALESCE(situacion_laboral, '') as situacion_laboral,
        COALESCE(agente_registra, '') as agente_registra,
        COALESCE(fecha_actualizacion::TIMESTAMP, '1970-01-01') as fecha_actualizacion,
        COALESCE(porcentaje_hoja_vida, '') as porcentaje_hoja_vida,
        COALESCE(prestador_anterior, '') as prestador_anterior,
        COALESCE(fecha_cambio_prestador::TIMESTAMP, '1970-01-01') as fecha_cambio_prestador,
        COALESCE(vereda_localidad_centro_poblado, '') as vereda_localidad_centro_poblado,
        COALESCE(pertenece_a, '') as pertenece_a,
        COALESCE(sise_offline, '') as sise_offline,
        COALESCE(mes, 0) as mes,
        COALESCE(anio, 0) as anio,
        COALESCE(punto_atencion, '') as punto_atencion, 
        COALESCE(fecha_accion::TIMESTAMP, '1970-01-01') as fecha_accion,
        COALESCE(grupos_etnicos, '') as grupos_etnicos,
        COALESCE(vca, '') as vca,
        COALESCE(discapacidad, '') as discapacidad,
        COALESCE(migrante, '') as migrante,
        COALESCE(vvg, '') as vvg,
        COALESCE(reincorporados, '') as reincorporados,
        COALESCE(filename, '') as filename,
        COALESCE(created_at::TIMESTAMP, '1970-01-01') as created_at
      FROM {{render(vars.table)}}
      WHERE mes = {{ inputs.month_of_interest }} AND anio = {{ inputs.year_of_interest }};
    fetchType: STORE
  
  - id: convert_monthly_data_to_parquet
    type: io.kestra.plugin.serdes.parquet.IonToParquet
    from: "{{ outputs.query_data_to_upload.uri }}"

  - id: upload_monthly_data_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.convert_monthly_data_to_parquet.uri }}"
    to: "gs://employment-agency-operational-data/{{ inputs.data_processed }}/{{ inputs.year_of_interest }}/{{ vars.month_name }}/registro_hv_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}.parquet"