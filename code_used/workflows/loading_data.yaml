  #     print(df.head())
      
  #     # Process your data
  #     # Example: Save as CSV
  #     df.to_csv('output.csv', index=False)

  - id: reading_monthly_registries
    type: io.kestra.plugin.scripts.python.Commands
    docker:
      image: python:3.11-slim
    description: "identifying the data registered in {{ inputs.month_of_interest }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include:
        - "registro_hv.py"
    beforeCommands:
      - pip install pandas numpy datetime openpyxl pyarrow fastparquet
    inputFiles:
      excel_file: '{{ outputs.download_file.uri }}'
    commands:
      - "python registro_hv.py"
    outputFiles:
      - "*.parquet"
      
  - id: log_completion
    type: io.kestra.core.tasks.log.Log
    message: "Excel file processed successfully"

  - id: create_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      -- Create main table if not exists
      CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
          id SERIAL PRIMARY KEY,
          no INTEGER,
          programa_aliado VARCHAR(255),
          barrio_donde_vive VARCHAR(255),
          tipo_documento VARCHAR(50),
          numero_documento VARCHAR(50),
          tipo_registro VARCHAR(50),
          nombres VARCHAR(255),
          apellidos VARCHAR(255),
          celular VARCHAR(50),
          telefono VARCHAR(50),
          canal_de_registro VARCHAR(100),
          edad INTEGER,
          rango_edad VARCHAR(50),
          genero VARCHAR(50),
          nivel_de_estudio VARCHAR(100),
          titulo_homologado VARCHAR(255),
          ciudad_de_residencia VARCHAR(100),
          email VARCHAR(255),
          fecha_registro TIMESTAMP,
          programa_de_gobierno VARCHAR(255),
          condiciones_especiales TEXT,
          detalle_discapacidades TEXT,
          situacion_laboral VARCHAR(100),
          agente_registra VARCHAR(255),
          fecha_actualizacion TIMESTAMP,
          porcentaje_hoja_vida VARCHAR(20),
          prestador_anterior VARCHAR(255),
          fecha_cambio_prestador TIMESTAMP,
          vereda_localidad_centro_poblado VARCHAR(255),
          pertenece_a VARCHAR(100),
          sise_offline VARCHAR(50),
          mes VARCHAR(20),
          anio INTEGER,
          punto_atencion VARCHAR(255),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      -- Create staging table
      CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
          LIKE {{render(vars.table)}} INCLUDING ALL
      );

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.reading_monthly_registries.outputFiles['registro_hv_'~ inputs.year_of_interest ~'_10.parquet'] }}"
    to: "gs://employment-agency-operational-data/{{ inputs.year_of_interest }}/{{ inputs.month_of_interest }}/registro_hv_{{ inputs.year_of_interest }}_10.parquet"