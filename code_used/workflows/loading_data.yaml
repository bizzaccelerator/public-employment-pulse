  #   beforeCommands:
  #     - pip install pandas openpyxl
  #   script: |
  #     import pandas as pd
      
  #     # Read the downloaded Excel file
  #     excel_file = '{{ outputs.download_file.uri }}'
      
  #     # Read all sheets or specific sheet
  #     df = pd.read_excel(excel_file, sheet_name='BD_Acumulado-2024-2025')
      
  #     # Display basic info
  #     print(f"Rows: {len(df)}")
