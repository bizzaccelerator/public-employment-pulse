id: gcs-data-pipeline
namespace: company.data

inputs:
  - id: year_of_interest
    type: SELECT
    description: Year of data to process.
    displayName: "Choose the year of interest."
    defaults: "2025"
    values: ["2024", "2025"]
  
  - id: month_of_interest
    type: SELECT
    description: Month of data to process.
    displayName: "Choose the month of interest."
    defaults: january
    values: 
      - january
      - february
      - march
      - april
      - may
      - june
      - july
      - august
      - september
      - october
      - november
      - december

variables:
  file: "{{inputs.taxi}}_tripdata_{{trigger.date | date('yyyy-MM')}}.csv"
  staging_table: "public.{{inputs.taxi}}_tripdata_staging"
  table: "public.{{inputs.taxi}}_tripdata"

tasks:
  - id: download_file
    type: io.kestra.plugin.gcp.gcs.Download
    from: gs://operations-raw-data_public-employment-pulse/BD_Registro_2024_2025_acumulado.xlsx

