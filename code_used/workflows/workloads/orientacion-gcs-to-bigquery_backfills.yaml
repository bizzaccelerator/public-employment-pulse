id: orientacion-gcs-to-bigquery-backfills
namespace: public_employment_pulse

# ─────────────────────────────────────────────────────────────────────────────
# DATA MODEL — one row per session event
# ─────────────────────────────────────────────────────────────────────────────
# Each orientation session and each workshop session is its own row.
# tipo_evento  = 'orientacion' | 'taller'
# The three date columns (fechaagendamiento, fechaejecucion, fechaevaluacion)
# hold the scalar date for THAT session.
# mes_evento / anio_evento  are integer scalars derived from fechaejecucion.
# ─────────────────────────────────────────────────────────────────────────────

inputs:
  - id: data_processed
    type: SELECT
    description: Data of interest to load.
    displayName: "Choose the data of interest."
    defaults: orientacion
    values: [ registro_hv, orientacion, intermediacion, vacantes, empresas ]

  - id: load_mode
    type: SELECT
    description: How to load data into BigQuery.
    displayName: "Choose load mode."
    defaults: WRITE_APPEND
    values: [ WRITE_APPEND, WRITE_TRUNCATE, WRITE_EMPTY ]

variables:
  month_name: "{{ trigger.date | date('MMMM') | lower }}"
  gcs_path: "gs://employment-agency-operational-data/{{ inputs.data_processed }}/{{ trigger.date | date('YYYY') }}/{{ vars.month_name }}/orientacion_hv_{{ trigger.date | date('YYYY') }}_{{ trigger.date | date('M') }}.parquet"
  bq_dataset: "operations_co"
  bq_table: "{{ inputs.data_processed }}"

tasks:
  - id: log_workflow_start
    type: io.kestra.plugin.core.log.Log
    message: |
      Starting BigQuery load for:
      File: {{ render(vars.gcs_path) }}
      Dataset: {{ render(vars.bq_dataset) }}
      Table: {{ render(vars.bq_table) }}
      Load Mode: {{ inputs.load_mode }}

  - id: create_bigquery_dataset
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE SCHEMA IF NOT EXISTS `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}`
      OPTIONS(
        location='US',
        description='Public Employment Pulse Data'
      );

  - id: create_bigquery_table
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE TABLE IF NOT EXISTS `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}` (

        -- ── Event type ──────────────────────────────────────────────────────
        -- 'orientacion' or 'taller'
        tipo_evento                   STRING,

        -- ── Person identifier ───────────────────────────────────────────────
        numerodocumento               STRING,

        -- ── Session dates (scalar — one date per row) ────────────────────────
        fechaagendamiento_orientacion TIMESTAMP,
        fechaejecucion_orientacion    TIMESTAMP,
        fechaevaluacion_orientacion   TIMESTAMP,

        -- ── Event time helpers ───────────────────────────────────────────────
        mes_evento                    INT64,
        anio_evento                   INT64,

        -- ── Session staff ────────────────────────────────────────────────────
        -- orientador is set for orientation rows; tallerista for taller rows
        orientador                    STRING,
        tallerista                    STRING,

        -- ── Service / programme fields ───────────────────────────────────────
        indicador                     STRING,
        tipodireccionamiento          STRING,
        tipodocumento                 STRING,
        correoelectronico             STRING,

        -- ── Person demographics ──────────────────────────────────────────────
        primernombre                  STRING,
        segundonombre                 STRING,
        primerapellido                STRING,
        segundoapellido               STRING,
        sexo                          STRING,
        ciudad                        STRING,
        departamento                  STRING,
        edad                          INT64,
        rango_de_edad                 STRING,

        -- ── Portfolio / convocatoria ─────────────────────────────────────────
        area                          STRING,
        tipo                          STRING,
        subtipo                       STRING,
        nombreportafolio              STRING,
        nombreconvocatoria            STRING,
        aprobacion                    STRING,
        porcentajeasistencia          FLOAT64,

        -- ── Provider / institution ───────────────────────────────────────────
        prestadornombre               STRING,
        institucionnombre             STRING,
        instituciondireccion          STRING,
        institucionmunicipio          STRING,
        instituciondepartamento       STRING,

        -- ── Government programme ─────────────────────────────────────────────
        programagobiernosino          BOOL,
        programagobierno              STRING,
        alianzasentidadesexternas     STRING,
        agencianombre                 STRING,
        numerotelefono                STRING,
        programa_de_gobierno          STRING,

        -- ── Special conditions & population flags ────────────────────────────
        condiciones_especiales        STRING,
        grupos_etnicos                STRING,
        vca                           STRING,
        discapacidad                  STRING,
        migrante                      STRING,
        vvg                           STRING,
        reincorporados                STRING,

        -- ── Audit ────────────────────────────────────────────────────────────
        loaded_at                     TIMESTAMP DEFAULT CURRENT_TIMESTAMP()
      )
      PARTITION BY RANGE_BUCKET(anio_evento, GENERATE_ARRAY(2024, 2030, 1))
      CLUSTER BY tipo_evento, departamento, mes_evento
      OPTIONS(
        description='Psychologist orientation data — one row per session event (orientacion or taller)',
        require_partition_filter=false
      );

  - id: load_parquet_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    from:
      - "{{ render(vars.gcs_path) }}"
    destinationTable: "{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}"
    format: PARQUET
    writeDisposition: "{{ inputs.load_mode }}"
    autodetect: false
    schema:
      fields:
        - name: tipo_evento
          type: STRING
          mode: NULLABLE
        - name: numerodocumento
          type: STRING
          mode: NULLABLE
        - name: fechaagendamiento_orientacion
          type: TIMESTAMP
          mode: NULLABLE
        - name: fechaejecucion_orientacion
          type: TIMESTAMP
          mode: NULLABLE
        - name: fechaevaluacion_orientacion
          type: TIMESTAMP
          mode: NULLABLE
        - name: mes_evento
          type: INT64
          mode: NULLABLE
        - name: anio_evento
          type: INT64
          mode: NULLABLE
        - name: orientador
          type: STRING
          mode: NULLABLE
        - name: tallerista
          type: STRING
          mode: NULLABLE
        - name: indicador
          type: STRING
          mode: NULLABLE
        - name: tipodireccionamiento
          type: STRING
          mode: NULLABLE
        - name: tipodocumento
          type: STRING
          mode: NULLABLE
        - name: correoelectronico
          type: STRING
          mode: NULLABLE
        - name: primernombre
          type: STRING
          mode: NULLABLE
        - name: segundonombre
          type: STRING
          mode: NULLABLE
        - name: primerapellido
          type: STRING
          mode: NULLABLE
        - name: segundoapellido
          type: STRING
          mode: NULLABLE
        - name: sexo
          type: STRING
          mode: NULLABLE
        - name: ciudad
          type: STRING
          mode: NULLABLE
        - name: departamento
          type: STRING
          mode: NULLABLE
        - name: edad
          type: INT64
          mode: NULLABLE
        - name: rango_de_edad
          type: STRING
          mode: NULLABLE
        - name: area
          type: STRING
          mode: NULLABLE
        - name: tipo
          type: STRING
          mode: NULLABLE
        - name: subtipo
          type: STRING
          mode: NULLABLE
        - name: nombreportafolio
          type: STRING
          mode: NULLABLE
        - name: nombreconvocatoria
          type: STRING
          mode: NULLABLE
        - name: aprobacion
          type: STRING
          mode: NULLABLE
        - name: porcentajeasistencia
          type: FLOAT64
          mode: NULLABLE
        - name: prestadornombre
          type: STRING
          mode: NULLABLE
        - name: institucionnombre
          type: STRING
          mode: NULLABLE
        - name: instituciondireccion
          type: STRING
          mode: NULLABLE
        - name: institucionmunicipio
          type: STRING
          mode: NULLABLE
        - name: instituciondepartamento
          type: STRING
          mode: NULLABLE
        - name: programagobiernosino
          type: BOOL
          mode: NULLABLE
        - name: programagobierno
          type: STRING
          mode: NULLABLE
        - name: alianzasentidadesexternas
          type: STRING
          mode: NULLABLE
        - name: agencianombre
          type: STRING
          mode: NULLABLE
        - name: numerotelefono
          type: STRING
          mode: NULLABLE
        - name: programa_de_gobierno
          type: STRING
          mode: NULLABLE
        - name: condiciones_especiales
          type: STRING
          mode: NULLABLE
        - name: grupos_etnicos
          type: STRING
          mode: NULLABLE
        - name: vca
          type: STRING
          mode: NULLABLE
        - name: discapacidad
          type: STRING
          mode: NULLABLE
        - name: migrante
          type: STRING
          mode: NULLABLE
        - name: vvg
          type: STRING
          mode: NULLABLE
        - name: reincorporados
          type: STRING
          mode: NULLABLE

  - id: verify_load_count
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      SELECT
        tipo_evento,
        COUNT(*)                        AS total_sesiones,
        COUNT(DISTINCT numerodocumento) AS personas_unicas,
        MIN(fechaejecucion_orientacion) AS fecha_min,
        MAX(fechaejecucion_orientacion) AS fecha_max
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}
      GROUP BY tipo_evento
      ORDER BY tipo_evento;
    store: true

  - id: check_data_quality
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      SELECT 'Missing edad'         AS issue, COUNT(*) AS count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE edad IS NULL
        AND mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}

      UNION ALL

      SELECT 'Missing sexo'         AS issue, COUNT(*) AS count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE (sexo IS NULL OR sexo = '')
        AND mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}

      UNION ALL

      SELECT 'Missing departamento' AS issue, COUNT(*) AS count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE (departamento IS NULL OR departamento = '')
        AND mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}

      UNION ALL

      SELECT 'Missing fechaejecucion' AS issue, COUNT(*) AS count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE fechaejecucion_orientacion IS NULL
        AND mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}

      ORDER BY count DESC;
    store: true

  - id: get_monthly_statistics
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      SELECT
        tipo_evento,
        departamento,
        COUNT(*)                        AS total_sesiones,
        COUNT(DISTINCT numerodocumento) AS personas_unicas,
        ROUND(AVG(edad), 1)             AS edad_promedio,
        COUNTIF(sexo = 'm')             AS hombres,
        COUNTIF(sexo = 'f')             AS mujeres,
        COUNTIF(vca IS NOT NULL)        AS vca,
        COUNTIF(discapacidad IS NOT NULL) AS pcd,
        COUNTIF(migrante IS NOT NULL)   AS migrantes,
        COUNTIF(vvg IS NOT NULL)        AS vvg,
        COUNTIF(reincorporados IS NOT NULL) AS reincorporados
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE mes_evento  = {{ trigger.date | date('M') }}
        AND anio_evento = {{ trigger.date | date('YYYY') }}
      GROUP BY tipo_evento, departamento
      ORDER BY tipo_evento, total_sesiones DESC;
    store: true

  - id: log_load_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ===== BigQuery Load Summary =====
      File: {{ render(vars.gcs_path) }}
      Table: {{ render(vars.bq_table) }}
      Load Mode: {{ inputs.load_mode }}
      Load completed successfully.

  - id: convert_verification_to_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.verify_load_count.uri }}"

  - id: convert_quality_to_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.check_data_quality.uri }}"

  - id: convert_statistics_to_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.get_monthly_statistics.uri }}"

  - id: send_completion_email
    type: io.kestra.plugin.notifications.mail.MailSend
    from: "{{ kv('SENDER_EMAIL') }}"
    to: "{{ kv('RECIPIENT_EMAILS') }}"
    subject: "BigQuery Load Complete — orientacion {{ trigger.date | date('M') }}/{{ trigger.date | date('YYYY') }}"
    htmlTextContent: |
      <h2>BigQuery Load Completed — Orientation Data</h2>
      <p><strong>Dataset:</strong> {{ render(vars.bq_dataset) }}</p>
      <p><strong>Table:</strong> {{ render(vars.bq_table) }}</p>
      <p><strong>Source File:</strong> {{ render(vars.gcs_path) }}</p>
      <p><strong>Load Mode:</strong> {{ inputs.load_mode }}</p>
      <p><strong>Month/Year:</strong> {{ trigger.date | date('M') }}/{{ trigger.date | date('YYYY') }}</p>

      <h3>Data model note</h3>
      <p>
        Each row is <strong>one session event</strong>.<br>
        <code>tipo_evento = 'orientacion'</code> or <code>'taller'</code>.<br>
        Dates are scalar TIMESTAMP values. Filter on <code>mes_evento</code> /
        <code>anio_evento</code> for monthly slices.
      </p>

      <h3>Attached Reports</h3>
      <ul>
        <li><strong>load_counts.csv</strong> — session counts and unique people per event type</li>
        <li><strong>data_quality.csv</strong> — missing edad / sexo / departamento / fechaejecucion</li>
        <li><strong>monthly_statistics.csv</strong> — breakdown by tipo_evento and departamento</li>
      </ul>
      <p><em>Workflow executed at: {{ now() }}</em></p>
    attachments:
      - name: load_counts.csv
        uri: "{{ outputs.convert_verification_to_csv.uri }}"
        contentType: text/csv
      - name: data_quality.csv
        uri: "{{ outputs.convert_quality_to_csv.uri }}"
        contentType: text/csv
      - name: monthly_statistics.csv
        uri: "{{ outputs.convert_statistics_to_csv.uri }}"
        contentType: text/csv
    host: "{{ kv('SMTP_SERVER') }}"
    port: "{{ kv('SMTP_PORT') }}"
    username: "{{ kv('GMAIL_USERNAME') }}"
    password: "{{ kv('GMAIL_APP_PASSWORD') }}"
    transportStrategy: SMTP_TLS

triggers:
  - id: schedule_monthly_load
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 5 * *"
    inputs:
      data_processed: orientacion
      load_mode: WRITE_APPEND