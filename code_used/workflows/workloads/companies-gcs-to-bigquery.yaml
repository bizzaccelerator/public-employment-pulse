id: companies-gcs-to-bigquery
namespace: public_employment_pulse

inputs:
  - id: data_processed
    type: SELECT
    description: Data of interest to load.
    displayName: "Choose the data of interest."
    defaults: empresas
    values: [ registro_hv, orientacion, intermediacion, vacantes, empresas ]

  - id: year_of_interest
    type: SELECT
    description: Year of data to load.
    displayName: "Choose the year of interest."
    defaults: "2026"
    values: [ "2024", "2025", "2026" ]

  - id: month_of_interest
    type: INT
    description: Month of data to load.
    displayName: "Choose the month number of interest."
    defaults: 1

  - id: load_mode
    type: SELECT
    description: How to load data into BigQuery.
    displayName: "Choose load mode."
    defaults: WRITE_APPEND
    values: [ WRITE_APPEND, WRITE_TRUNCATE, WRITE_EMPTY ]

variables:
  month_name: "{% set month_names = {1: 'january', 2: 'february', 3: 'march', 4: 'april', 5: 'may', 6: 'june', 7: 'july', 8: 'august', 9: 'september', 10: 'october', 11: 'november', 12: 'december'} %}{{ month_names[inputs.month_of_interest] }}"
  gcs_path: "gs://employment-agency-operational-data/{{ inputs.data_processed }}/{{ inputs.year_of_interest }}/{{ vars.month_name }}/empresas_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}.parquet"
  bq_dataset: "operations_co"
  bq_table: "{{ inputs.data_processed }}"

tasks:
  - id: log_workflow_start
    type: io.kestra.plugin.core.log.Log
    message: |
      Starting BigQuery load for:
      File: {{ render(vars.gcs_path) }}
      Dataset: {{ render(vars.bq_dataset) }}
      Table: {{ render(vars.bq_table) }}
      Load Mode: {{ inputs.load_mode }}

  - id: create_bigquery_dataset
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE SCHEMA IF NOT EXISTS `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}`
      OPTIONS(
        location='US',
        description='Public Employment Pulse Data'
      );

  # - id: drop_existing_table
  #   type: io.kestra.plugin.gcp.bigquery.Query
  #   sql: |
  #     DROP TABLE IF EXISTS `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`;

  - id: create_bigquery_table
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE TABLE IF NOT EXISTS `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}` (
        unique_row_id STRING,
        tipo_documento STRING,
        numero_documento STRING,
        razon_social STRING,
        naturaleza STRING,
        tipo_empresa STRING,
        actividad_economica STRING,
        sector STRING,
        tamanio STRING,
        codigo_sede STRING,
        nombre_sede STRING,
        telefono STRING,
        direccion STRING,
        tipo_sede STRING,
        ciudad STRING,
        departamento STRING,
        nombre_administrador STRING,
        email_administrador STRING,
        fecha_registro TIMESTAMP,
        canal_de_registro STRING,
        prestador_aprobo STRING,
        agencia_aprobo STRING,
        agente_aprobo STRING,
        pais STRING,
        telefono_clean STRING,
        mes INT64,
        anio INT64,
        created_at TIMESTAMP,
        filename STRING,
        loaded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP()
      )
      PARTITION BY DATE(fecha_registro)
      CLUSTER BY departamento, sector
      OPTIONS(
        description='Companies registration data',
        require_partition_filter=false
      );

  - id: load_parquet_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    from: 
      - "{{ render(vars.gcs_path) }}"
    destinationTable: "{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}"
    format: PARQUET
    writeDisposition: "{{ inputs.load_mode }}"
    autodetect: false
    schema:
      fields:
        - name: unique_row_id
          type: STRING
          mode: NULLABLE
        - name: tipo_documento
          type: STRING
          mode: NULLABLE
        - name: numero_documento
          type: STRING
          mode: NULLABLE
        - name: razon_social
          type: STRING
          mode: NULLABLE
        - name: naturaleza
          type: STRING
          mode: NULLABLE
        - name: tipo_empresa
          type: STRING
          mode: NULLABLE
        - name: actividad_economica
          type: STRING
          mode: NULLABLE
        - name: sector
          type: STRING
          mode: NULLABLE
        - name: tamanio
          type: STRING
          mode: NULLABLE
        - name: codigo_sede
          type: STRING
          mode: NULLABLE
        - name: nombre_sede
          type: STRING
          mode: NULLABLE
        - name: telefono
          type: STRING
          mode: NULLABLE
        - name: direccion
          type: STRING
          mode: NULLABLE
        - name: tipo_sede
          type: STRING
          mode: NULLABLE
        - name: ciudad
          type: STRING
          mode: NULLABLE
        - name: departamento
          type: STRING
          mode: NULLABLE
        - name: nombre_administrador
          type: STRING
          mode: NULLABLE
        - name: email_administrador
          type: STRING
          mode: NULLABLE
        - name: fecha_registro
          type: TIMESTAMP
          mode: NULLABLE
        - name: canal_de_registro
          type: STRING
          mode: NULLABLE
        - name: prestador_aprobo
          type: STRING
          mode: NULLABLE
        - name: agencia_aprobo
          type: STRING
          mode: NULLABLE
        - name: agente_aprobo
          type: STRING
          mode: NULLABLE
        - name: pais
          type: STRING
          mode: NULLABLE
        - name: telefono_clean
          type: STRING
          mode: NULLABLE
        - name: mes
          type: INT64
          mode: NULLABLE
        - name: anio
          type: INT64
          mode: NULLABLE
        - name: created_at
          type: TIMESTAMP
          mode: NULLABLE
        - name: filename
          type: STRING
          mode: NULLABLE

  - id: verify_load_count
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      SELECT 
        COUNT(*) as total_records,
        COUNT(DISTINCT unique_row_id) as unique_records,
        MIN(fecha_registro) as earliest_date,
        MAX(fecha_registro) as latest_date,
        filename
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE filename = 'empresas_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}'
      GROUP BY filename;
    store: true

  - id: check_data_quality
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      SELECT
        'Missing numero_documento' as issue,
        COUNT(*) as count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE numero_documento IS NULL
        AND filename = 'empresas_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}'
      
      UNION ALL
      
      SELECT
        'Missing actividad_economica' as issue,
        COUNT(*) as count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE actividad_economica IS NULL OR actividad_economica = ''
        AND filename = 'empresas_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}'
      
      UNION ALL
      
      SELECT
        'Missing direccion' as issue,
        COUNT(*) as count
      FROM `{{ kv('GCP_PROJECT_ID') }}.{{ render(vars.bq_dataset) }}.{{ render(vars.bq_table) }}`
      WHERE direccion IS NULL OR direccion = ''
        AND filename = 'empresas_{{ inputs.year_of_interest }}_{{ inputs.month_of_interest }}'
      
      ORDER BY count DESC;
    store: true

  - id: log_load_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ===== BigQuery Load Summary =====
      File: {{ render(vars.gcs_path) }}
      Dataset: {{ render(vars.bq_dataset) }}
      Table: {{ render(vars.bq_table) }}
      Load Mode: {{ inputs.load_mode }}
      
      Load completed successfully. Check email for detailed statistics.

  - id: convert_verification_to_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.verify_load_count.uri }}"

  - id: convert_quality_to_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.check_data_quality.uri }}"

  - id: send_completion_email
    type: io.kestra.plugin.notifications.mail.MailSend
    from: "{{ kv('SENDER_EMAIL') }}"
    to: "{{ kv('RECIPIENT_EMAILS') }}"
    subject: "BigQuery Load Complete - {{ inputs.data_processed }} {{ inputs.month_of_interest }}/{{ inputs.year_of_interest }}"
    htmlTextContent: |
      <h2>BigQuery Data Load Completed</h2>
      <p><strong>Dataset:</strong> {{ render(vars.bq_dataset) }}</p>
      <p><strong>Table:</strong> {{ render(vars.bq_table) }}</p>
      <p><strong>Source File:</strong> {{ render(vars.gcs_path) }}</p>
      <p><strong>Load Mode:</strong> {{ inputs.load_mode }}</p>
      
      <p>Please see attached files for load statistics and data quality summary.</p>
      
      <p><em>Workflow executed at: {{ now() }}</em></p>
    attachments:
      - name: load_statistics.csv
        uri: "{{ outputs.convert_verification_to_csv.uri }}"
        contentType: text/csv
      - name: data_quality.csv
        uri: "{{ outputs.convert_quality_to_csv.uri }}"
        contentType: text/csv
    host: "{{ kv('SMTP_SERVER') }}"
    port: "{{ kv('SMTP_PORT') }}"
    username: "{{ kv('GMAIL_USERNAME') }}"
    password: "{{ kv('GMAIL_APP_PASSWORD') }}"
    transportStrategy: SMTP_TLS

triggers:
  - id: schedule_monthly_load
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 5 * *"  # Run at 2 AM on the 5th of each month
    inputs:
      data_processed: empresas
      year_of_interest: "{{ now() | date('yyyy') }}"
      month_of_interest: "{{ now() | date('M') | int }}"
      load_mode: WRITE_APPEND