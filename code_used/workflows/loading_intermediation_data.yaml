id: intermediation-raw-data-pipeline
namespace: public_employment_pulse

inputs:
  - id: data_processed
    type: SELECT
    description: Data of interest processed.
    displayName: "Choose the data of interest."
    defaults: intermediacion
    values: [ registro_hv, orientacion, intermediacion, vacantes, empresas ]

  - id: year_of_interest
    type: SELECT
    description: Year of data to process.
    displayName: "Choose the year of interest."
    defaults: "2025"
    values: [ "2024", "2025" ]

  - id: month_of_interest
    type: INT
    description: Month of data to process.
    displayName: "Choose the month number of interest."
    defaults: 1
    
variables:
  staging_table: "public.{{inputs.data_processed}}_staging"
  table: "public.{{inputs.data_processed}}"
  file: "{{inputs.data_processed}}_{{ inputs.year_of_interest}}_{{inputs.month_of_interest}}"
  month_name: "{% set month_names = {1: 'january', 2: 'february', 3: 'march', 4: 'april', 5: 'may', 6: 'june', 7: 'july', 8: 'august', 9: 'september', 10: 'october', 11: 'november', 12: 'december'} %}{{ month_names[inputs.month_of_interest] }}"
  month_padded: "{{ '%02d' | format(inputs.month_of_interest) }}"

tasks:
  - id: download_intermediation_file
    type: io.kestra.plugin.gcp.gcs.Download
    from: gs://operations-raw-data_public-employment-pulse/Base de Intermediacion Laboral 2025.xlsx
  
  - id: reading_monthly_registries
    type: io.kestra.plugin.scripts.python.Commands
    docker:
      image: python:3.11-slim
    description: "identifying the people sent to interviews in {{ vars.month_name }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include:
        - "intermediacion_hv.py"
    beforeCommands:
      - pip install pandas numpy openpyxl pyarrow fastparquet
    inputFiles:
      intermediacion: '{{ outputs.download_intermediation_file.uri }}'
    env:
      MONTH: "{{ inputs.month_of_interest }}"
      YEAR: "{{ inputs.year_of_interest }}"
    commands:
      - "python intermediacion_hv.py"
    outputFiles:
      - "*.parquet"
      - "registries_count.txt"
  
  - id: log_completion
    type: io.kestra.core.tasks.log.Log
    message: "Excel files processed successfully"
  
  - id: drop_tables_if_exists
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      DROP TABLE IF EXISTS {{render(vars.staging_table)}};
      DROP TABLE IF EXISTS {{render(vars.table)}};
  
  - id: create_intermediation_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://{{ kv('POSTGRES_HOST') }}:{{ kv('POSTGRES_PORT') }}/{{ kv('POSTGRES_DB') }}
    username: "{{ kv('POSTGRES_USER') }}"
    password: "{{ kv('POSTGRES_PASSWORD') }}"
    sql: |
      -- Create main table if not exists
      CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
          id SERIAL PRIMARY KEY,
          item INTEGER,
          mes_registro VARCHAR(100),
          convenio VARCHAR(200),
          gestion_vacante VARCHAR(200),
          poblacion VARCHAR(100),
          no VARCHAR(50),
          codigo_proceso VARCHAR(200),
          nombre_de_la_empresa VARCHAR(255),
          nombre_de_la_vacante VARCHAR(255),
          puestos_de_trabajo_en_plataforma INTEGER,
          fecha_de_publicacion_de_la_vacante TIMESTAMP,
          fecha_de_vencimiento_de_la_vacante TIMESTAMP,
          hojas_de_vida_remitidas INTEGER,
          fecha_envio_hojas_de_vida_a_la_empresa TIMESTAMP,
          nombre_del_candidato VARCHAR(255),
          cedula VARCHAR(50),
          telefono VARCHAR(50),
          edad INTEGER,
          rango_de_edad VARCHAR(50),
          nivel_educativo VARCHAR(100),
          formacion VARCHAR(255),
          sexo VARCHAR(20),
          barrio VARCHAR(100),
          condicion VARCHAR(100),
          gestor VARCHAR(200),
          intermediador VARCHAR(200),
          llamada_convocatoria_base_de_datos VARCHAR(100),
          observacion_intermediacion TEXT,
          observacion_gestion TEXT,
          observacion_del_candidato TEXT,
          mes_de_colocacion_en_plataforma VARCHAR(50),
          colocado BOOLEAN,
          semana_publicacion_vacante INTEGER,
          mes_publicacion_vacante VARCHAR(50),
          tipo_de_vacante VARCHAR(100),
          anio_publicacion_vacante INTEGER,
          discapacidad VARCHAR(100),
          vca VARCHAR(100),
          vvg VARCHAR(100),
          migrante VARCHAR(100),
          etnias VARCHAR(100),
          reincorporados VARCHAR(100),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      
      -- Create staging table
      CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
          LIKE {{render(vars.table)}} INCLUDING ALL
      );
  

